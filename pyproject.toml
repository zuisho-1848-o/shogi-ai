[project]
name = "kifu-review"
version = "0.1.0"
description = "KIF棋譜をやねうら王で解析し、振り返るべき手と理由をレポートする"
requires-python = ">=3.10"
dependencies = ["python-shogi>=1.1"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["kifu_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
